<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surga5000</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="utility-bar">
        <div class="utility-top-row">
            <div class="top-logo">
                <img src="logo-surga5000.png" alt="SURGA5000">
            </div>
            
            <div class="running-text-container">
                <i class="fa-solid fa-bullhorn text-white"></i>
                <marquee class="running-text">Selamat datang di website terpercaya Surga!</marquee>
            </div>

            <div class="top-right-info">
                <div class="btn-pengaduan">
                    <i class="fa-solid fa-circle-exclamation"></i> Pengaduan Member
                </div>
                <span id="realtime-clock" class="clock-text"></span>
                <span class="separator">|</span>
                <i class="fa-solid fa-share-nodes"></i>
                <span class="separator">|</span>
                <div class="flex items-center gap-1">
                    <img src="flag-indo.png" style="width: 20px; border-radius: 50%;">
                    <span class="text-[11px] font-bold">INDONESIA • INDONESIA</span>
                    <span class="separator">|</span>
                </div>
            </div>
        </div>

        <div class="utility-bottom-row">
            <div class="utility-icons">
                <i class="fa-regular fa-circle-question"></i>
                <span class="separator">|</span>
                <i class="fa-solid fa-circle-exclamation"></i>
                <span class="separator">|</span>
                <i class="fa-regular fa-comments"></i>
                <span class="separator">|</span>
            </div>
            <div class="auth-buttons">
                <button class="btn-login">LOGIN</button>
                <button class="btn-daftar">DAFTAR</button>
            </div>
        </div>
    </div>

    <nav class="nav-main">
        <div class="nav-container">
            <div class="nav-item"><i class="fa-solid fa-volleyball"></i><span>Piala Dunia FIFA</span></div>
            <div class="nav-item active"><i class="fa-solid fa-scroll"></i><span>Slots</span></div>
            <div class="nav-item"><i class="fa-solid fa-video"></i><span>Live Games</span></div>
            <div class="nav-item"><i class="fa-solid fa-futbol"></i><span>Sports</span></div>
            <div class="nav-item"><i class="fa-solid fa-clone"></i><span>Casino</span></div>
            <div class="nav-item"><i class="fa-solid fa-fish"></i><span>Tembak Ikan</span></div>
            <div class="nav-item"><i class="fa-solid fa-bowling-ball"></i><span>Lotre</span></div>
            <div class="nav-item"><i class="fa-solid fa-gamepad"></i><span>E-Games</span></div>
            <div class="nav-item"><i class="fa-solid fa-gift"></i><span>Promosi</span></div>
            <div class="nav-item"><i class="fa-solid fa-users"></i><span>REFERRAL</span></div>
            <div class="nav-item rtp-pulse">
                <img src="20250624182022000000452afc9c35__SURGA5000__172x172.webp" alt="RTP" class="rtp-img-icon">
                <span>LIVE RTP</span>
            </div>
        </div>
    </nav>

    <main>
        <div class="slideshow-container">
            <div class="banner-track">
                <img src="banner1.jpg" onerror="this.src='https://via.placeholder.com/1200x350?text=Banner+1'">
                <img src="banner2.jpg" onerror="this.src='https://via.placeholder.com/1200x350?text=Banner+2'">
            </div>
        </div>

        <section class="info-section">
            <div class="container-custom">
                <div class="info-flex">
                    <div class="jackpot-box">
                        <div class="jackpot-inner">
                            <img src="new_ug_progressive_jackpot.webp" class="jackpot-bg">
                            <div class="jackpot-text-layer">
                                <span id="jackpot-counter" class="jackpot-number">IDR 35,889,891,144.00</span>
                            </div>
                        </div>
                    </div>

                    <div class="provider-box">
                        <h3 class="hot-title-static">HOT PROVIDER</h3>
                        <div class="provider-slider-container">
                            <div class="provider-track-animate">
                                <div class="p-item"><img src="pragmatic.png" alt="AG"></div>
                                <div class="p-item"><img src="ag.png" alt="AG"></div>
                                <div class="p-item"><img src="skywind.png" alt="Skywind"></div>
                                <div class="p-item"><img src="spadegaming.png" alt="Spadegaming"></div>
                                <div class="p-item"><img src="fachai.webp" alt="Fachai"></div>
                                <div class="p-item"><img src="sbo.png" alt="SBO"></div>
                                <div class="p-item"><img src="allbet.png" alt="Allbet"></div>
                                <div class="p-item"><img src="evo.png" alt="Evolution"></div>
                                <div class="p-item"><img src="habanero.png" alt="Habanero"></div>
                                <div class="p-item"><img src="ibc.png" alt="IBC"></div>
                                <div class="p-item"><img src="joker.png" alt="Joker"></div>
                                <div class="p-item"><img src="pgsolf.png" alt="PG Soft"></div>
                                <div class="p-item"><img src="playtech.png" alt="Playtech"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="hot-games-section">
            <div class="container-custom">
                <div class="hot-header-frame">
                    <div class="hot-title-bg">
                        <h3 class="hot-games-title">HOT GAMES</h3>
                    </div>
                </div>

                <div class="games-grid">
                    <div class="game-card"><div class="game-img-wrapper"><img src="sweet-bonanza.jpg" alt="Sweet Bonanza" onerror="this.src='https://via.placeholder.com/150x150?text=Game+1'"></div></div>
                    <div class="game-card"><div class="game-img-wrapper"><img src="sweet-bonanza-candyland.jpg" alt="Sweet Bonanza CandyLand" onerror="this.src='https://via.placeholder.com/150x150?text=Game+2'"></div></div>
                    <div class="game-card"><div class="game-img-wrapper"><img src="mahjong-ways-2.jpg" alt="Mahjong Ways 2" onerror="this.src='https://via.placeholder.com/150x150?text=Game+3'"></div></div>
                    <div class="game-card"><div class="game-img-wrapper"><img src="mahjong-origin.jpg" alt="Mahjong Origin" onerror="this.src='https://via.placeholder.com/150x150?text=Game+4'"></div></div>
                    <div class="game-card"><div class="game-img-wrapper"><img src="wild-bounty-showdown.jpg" alt="Wild Bounty Showdown" onerror="this.src='https://via.placeholder.com/150x150?text=Game+5'"></div></div>
                    <div class="game-card"><div class="game-img-wrapper"><img src="fortune-gems-500.jpg" alt="Fortune Gems 500" onerror="this.src='https://via.placeholder.com/150x150?text=Game+6'"></div></div>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
